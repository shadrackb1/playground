<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>2048 · Playground</title>
  <style>
    body { margin:0; background:#0b1220; color:#e2e8f0; font-family:ui-monospace,Menlo,monospace; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:24px; }
    h1 { font-size:18px; margin-bottom:8px; }
    .hud { color:#64748b; font-size:13px; margin-bottom:12px; display:flex; gap:20px; }
    #board { display:grid; grid-template-columns:repeat(4,72px); gap:10px; touch-action:none; }
    .tile { width:72px; height:72px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:600; border:1px solid #1e293b; background:#0f172a; color:#64748b; }
    .t2{background:#0c1a2e;color:#7dd3fc}.t4{background:#0e2a3a;color:#22d3ee}
    .t8{background:#0b3a3a;color:#34d399}.t16{background:#3a2a0b;color:#fbbf24}
    .t32{background:#3a1a0b;color:#fb923c}.t64{background:#3a0b1a;color:#f472b6}
    .t128{background:#2a0b3a;color:#c084fc}.t256{background:#1a0b3a;color:#a78bfa}
    .t512{background:#0b1a3a;color:#60a5fa}.t1024{background:#0b3a2a;color:#2dd4bf}
    .t2048{background:#22d3ee;color:#0b1220;border-color:#22d3ee}
    button { margin-top:14px; background:transparent; color:#22d3ee; border:1px solid #22d3ee; border-radius:8px; padding:8px 14px; font-family:inherit; cursor:pointer; }
    p { color:#64748b; font-size:12px; margin-top:12px; }
    a { color:#22d3ee; text-decoration:none; }
  </style>
</head>
<body>
  <h1>2048</h1>
  <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><span id="state"></span></div>
  <div id="board"></div>
  <button id="new">New game</button>
  <p>Arrows / WASD / swipe · <a href="index.html">back</a></p>
  <script>
    const board = document.getElementById('board');
    let grid, score, best=+(localStorage.getItem('g2048-best')||0), over=false;
    document.getElementById('best').textContent=best;
    function empty(){ return Array.from({length:4},()=>Array(4).fill(0)); }
    function spawn(){
      const zeros=[];
      for(let i=0;i<4;i++)for(let j=0;j<4;j++) if(!grid[i][j]) zeros.push([i,j]);
      if(!zeros.length) return;
      const [i,j]=zeros[(Math.random()*zeros.length)|0];
      grid[i][j]=Math.random()<0.9?2:4;
    }
    function slide(row){
      const a=row.filter(Boolean);
      for(let i=0;i<a.length-1;i++){
        if(a[i]===a[i+1]){ a[i]*=2; score+=a[i]; a.splice(i+1,1); }
      }
      while(a.length<4) a.push(0);
      return a;
    }
    function rotate(g){
      const n=empty();
      for(let i=0;i<4;i++)for(let j=0;j<4;j++) n[j][3-i]=g[i][j];
      return n;
    }
    function move(dir){
      if(over) return;
      let g=grid.map(r=>r.slice());
      if(dir==='left') g=g.map(slide);
      if(dir==='right') g=g.map(r=>slide(r.slice().reverse()).reverse());
      if(dir==='up'){ g=rotate(g); g=g.map(slide); g=rotate(g); g=rotate(g); g=rotate(g); }
      if(dir==='down'){ g=rotate(g); g=g.map(r=>slide(r.slice().reverse()).reverse()); g=rotate(g); g=rotate(g); g=rotate(g); }
      if(JSON.stringify(g)===JSON.stringify(grid)) return;
      grid=g; spawn(); draw();
      if(score>best){ best=score; localStorage.setItem('g2048-best',best); document.getElementById('best').textContent=best; }
      if(!canMove()) { over=true; document.getElementById('state').textContent='game over · press New'; }
    }
    function canMove(){
      for(let i=0;i<4;i++)for(let j=0;j<4;j++){
        if(!grid[i][j]) return true;
        if(i<3 && grid[i][j]===grid[i+1][j]) return true;
        if(j<3 && grid[i][j]===grid[i][j+1]) return true;
      }
      return false;
    }
    function draw(){
      board.innerHTML='';
      grid.forEach(row=>row.forEach(v=>{
        const d=document.createElement('div');
        d.className='tile'+(v?' t'+v:'');
        d.textContent=v||'';
        board.appendChild(d);
      }));
      document.getElementById('score').textContent=score;
    }
    function reset(){
      grid=empty(); score=0; over=false; document.getElementById('state').textContent='';
      spawn(); spawn(); draw();
    }
    addEventListener('keydown',e=>{
      const k=e.key.toLowerCase();
      const map={arrowleft:'left',a:'left',arrowright:'right',d:'right',arrowup:'up',w:'up',arrowdown:'down',s:'down'};
      if(map[k]){ e.preventDefault(); move(map[k]); }
    });
    let tx=0,ty=0;
    document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
    document.addEventListener('touchend',e=>{
      const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
      if(Math.abs(dx)<20&&Math.abs(dy)<20) return;
      if(Math.abs(dx)>Math.abs(dy)) move(dx>0?'right':'left');
      else move(dy>0?'down':'up');
    },{passive:true});
    document.getElementById('new').onclick=reset;
    reset();
  </script>
</body>
</html>
