<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pong · Playground</title>
  <style>
    body { margin:0; background:#0b1220; color:#e2e8f0; font-family:ui-monospace,Menlo,monospace; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:24px; }
    h1 { font-size:18px; margin-bottom:8px; }
    .hud { color:#64748b; font-size:13px; margin-bottom:12px; display:flex; gap:20px; }
    canvas { background:#0f172a; border:1px solid #1e293b; border-radius:8px; touch-action:none; max-width:100%; cursor:none; }
    p { color:#64748b; font-size:12px; margin-top:12px; }
    a { color:#22d3ee; text-decoration:none; }
  </style>
</head>
<body>
  <h1>Pong</h1>
  <div class="hud"><span>You <b id="you">0</b></span><span>AI <b id="ai">0</b></span><span id="state">first to 7</span></div>
  <canvas id="c" width="640" height="400"></canvas>
  <p>Move with mouse or touch · R to reset · <a href="index.html">back</a></p>
  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    const W = c.width, H = c.height, PW = 10, PH = 70;
    let py = H/2 - PH/2, ay = H/2 - PH/2;
    let ball = {x:W/2,y:H/2,vx:5,vy:3,r:7};
    let you=0, ai=0, over=false;
    function resetBall(dir) {
      ball = {x:W/2, y:H/2 + (Math.random()*80-40), vx:5*(dir||1), vy: (Math.random()*6-3)};
    }
    function sync() {
      document.getElementById('you').textContent = you;
      document.getElementById('ai').textContent = ai;
      document.getElementById('state').textContent = over ? (you>ai?'you win · R':'ai wins · R') : 'first to 7';
    }
    function step() {
      if (over) return;
      ball.x += ball.vx; ball.y += ball.vy;
      if (ball.y < ball.r || ball.y > H-ball.r) ball.vy *= -1;
      // player
      if (ball.x < 24+PW && ball.x > 20 && ball.y > py && ball.y < py+PH && ball.vx < 0) {
        ball.vx *= -1.05;
        ball.vy += ((ball.y - (py+PH/2)) / PH) * 4;
      }
      // ai paddle
      const target = ball.y - PH/2;
      ay += Math.max(-4.2, Math.min(4.2, (target - ay) * 0.12));
      ay = Math.max(0, Math.min(H-PH, ay));
      if (ball.x > W-24-PW && ball.x < W-20 && ball.y > ay && ball.y < ay+PH && ball.vx > 0) {
        ball.vx *= -1.05;
        ball.vy += ((ball.y - (ay+PH/2)) / PH) * 4;
      }
      if (ball.x < 0) { ai++; sync(); resetBall(1); }
      if (ball.x > W) { you++; sync(); resetBall(-1); }
      ball.vx = Math.max(-12, Math.min(12, ball.vx));
      ball.vy = Math.max(-9, Math.min(9, ball.vy));
      if (you>=7 || ai>=7) over = true;
    }
    function draw() {
      ctx.fillStyle='#0f172a'; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle='#1e293b'; ctx.setLineDash([6,10]); ctx.beginPath();
      ctx.moveTo(W/2,16); ctx.lineTo(W/2,H-16); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle='#38bdf8'; ctx.fillRect(20, py, PW, PH);
      ctx.fillStyle='#a78bfa'; ctx.fillRect(W-20-PW, ay, PW, PH);
      ctx.fillStyle='#e2e8f0'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle='#64748b'; ctx.font='28px ui-monospace,monospace'; ctx.textAlign='center';
      ctx.fillText(you, W/2-50, 40); ctx.fillText(ai, W/2+50, 40);
      if (over) {
        ctx.fillStyle='rgba(11,18,32,.75)'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#e2e8f0'; ctx.font='22px ui-monospace,monospace';
        ctx.fillText(you>ai?'You win':'AI wins', W/2, H/2);
      }
    }
    function loop() { step(); draw(); requestAnimationFrame(loop); }
    function setY(clientY) {
      const r = c.getBoundingClientRect();
      const y = (clientY - r.top) * (H / r.height);
      py = Math.max(0, Math.min(H-PH, y - PH/2));
    }
    c.addEventListener('mousemove', e => setY(e.clientY));
    c.addEventListener('touchmove', e => { e.preventDefault(); setY(e.touches[0].clientY); }, {passive:false});
    addEventListener('keydown', e => { if (e.key.toLowerCase()==='r') { you=0; ai=0; over=false; py=H/2-PH/2; resetBall(1); sync(); }});
    resetBall(1); sync(); loop();
  </script>
</body>
</html>
