<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake · Playground</title>
  <style>
    body { margin:0; background:#0b1220; color:#e2e8f0; font-family:ui-monospace,Menlo,monospace; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:24px; }
    h1 { font-size:18px; margin-bottom:8px; }
    .hud { color:#64748b; font-size:13px; margin-bottom:12px; display:flex; gap:20px; }
    canvas { background:#0f172a; border:1px solid #1e293b; border-radius:8px; touch-action:none; max-width:100%; }
    p { color:#64748b; font-size:12px; margin-top:12px; }
    a { color:#22d3ee; text-decoration:none; }
  </style>
</head>
<body>
  <h1>Snake</h1>
  <div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><span id="state">playing</span></div>
  <canvas id="c" width="400" height="400"></canvas>
  <p>Arrows / WASD / swipe · Space to pause · <a href="index.html">back</a></p>
  <script>
    const c = document.getElementById('c'), ctx = c.getContext('2d');
    const N = 20, S = c.width / N;
    let snake, dir, next, food, score, best = +(localStorage.getItem('snake-best')||0), speed, alive, paused, acc, last;
    document.getElementById('best').textContent = best;
    function reset() {
      snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
      dir = {x:1,y:0}; next = {x:1,y:0};
      score = 0; speed = 120; alive = true; paused = false; acc = 0; last = performance.now();
      placeFood(); sync();
    }
    function placeFood() {
      do { food = {x: (Math.random()*N)|0, y: (Math.random()*N)|0}; }
      while (snake.some(s => s.x===food.x && s.y===food.y));
    }
    function sync() {
      document.getElementById('score').textContent = score;
      document.getElementById('state').textContent = !alive ? 'game over · R' : paused ? 'paused' : 'playing';
    }
    function step() {
      dir = next;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
      if (head.x<0||head.y<0||head.x>=N||head.y>=N || snake.some(s=>s.x===head.x&&s.y===head.y)) {
        alive = false; if (score>best){best=score; localStorage.setItem('snake-best',best); document.getElementById('best').textContent=best;}
        sync(); return;
      }
      snake.unshift(head);
      if (head.x===food.x && head.y===food.y) {
        score += 10; speed = Math.max(60, speed - 2); placeFood(); sync();
      } else snake.pop();
    }
    function draw() {
      ctx.fillStyle = '#0f172a'; ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle = '#1e293b';
      for (let i=0;i<N;i++) for (let j=0;j<N;j++) if ((i+j)%2===0) ctx.fillRect(i*S,j*S,S,S);
      ctx.fillStyle = '#f87171'; ctx.beginPath(); ctx.arc((food.x+.5)*S,(food.y+.5)*S,S*.35,0,Math.PI*2); ctx.fill();
      snake.forEach((s,i) => {
        ctx.fillStyle = i===0 ? '#34d399' : `rgba(52,211,153,${1-i/snake.length*0.7})`;
        ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2);
      });
      if (!alive) {
        ctx.fillStyle='rgba(11,18,32,.75)'; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle='#e2e8f0'; ctx.font='20px ui-monospace,monospace'; ctx.textAlign='center';
        ctx.fillText('Game over', c.width/2, c.height/2-10);
        ctx.font='13px ui-monospace,monospace'; ctx.fillStyle='#64748b';
        ctx.fillText('press R to restart', c.width/2, c.height/2+16);
      }
    }
    function loop(t) {
      const dt = t - last; last = t;
      if (alive && !paused) {
        acc += dt;
        while (acc >= speed) { step(); acc -= speed; if (!alive) break; }
      }
      draw(); requestAnimationFrame(loop);
    }
    addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      const map = {
        arrowup:[0,-1], w:[0,-1], arrowdown:[0,1], s:[0,1],
        arrowleft:[-1,0], a:[-1,0], arrowright:[1,0], d:[1,0]
      };
      if (map[k]) {
        e.preventDefault();
        const [x,y] = map[k];
        if (x !== -dir.x || y !== -dir.y) next = {x,y};
      }
      if (k === ' ') { e.preventDefault(); paused = !paused; sync(); }
      if (k === 'r') reset();
    });
    let tx=0, ty=0;
    c.addEventListener('touchstart', e => { const t=e.changedTouches[0]; tx=t.clientX; ty=t.clientY; }, {passive:true});
    c.addEventListener('touchend', e => {
      const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty;
      if (Math.abs(dx)<10 && Math.abs(dy)<10) return;
      if (Math.abs(dx)>Math.abs(dy)) next = {x: dx>0?1:-1, y:0};
      else next = {x:0, y: dy>0?1:-1};
    }, {passive:true});
    reset(); requestAnimationFrame(loop);
  </script>
</body>
</html>
